<style>
  :root {
    --doc-brand: #1C1440;
    --doc-brand-soft: #F0EDFF;
    --doc-accent: #7357F6;
    --doc-accent-dark: #6447EE;
    --doc-ink: #0A0E1A;
    --doc-ink-soft: #4B5563;
    --doc-mute: #8A93A3;
    --doc-line: #E7EAF0;
    --doc-paper: #F7F8FC;
  }
  * { box-sizing: border-box; }
  body { background: var(--doc-paper); color: var(--doc-ink); font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; }
  .doc-wrap { min-height: 100vh; padding: 48px 16px; }
  .doc-card {
    max-width: 760px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(28,20,64,.04), 0 32px 64px -28px rgba(28,20,64,.28);
  }
  /* Shell de 2 columnas para documentos de cara al cliente (cotizacion,
     contrato, cuestionario) -- Kevin: "quiero algo diferente, no solo
     cambiar cosas pequenas". En vez de una tarjeta apilada con un banner
     arriba, la info del documento (marca, tipo, total, estado, acciones)
     vive en un riel fijo a la izquierda con degradado oscuro, y el
     contenido (partes, items, terminos, formulario) en un panel blanco a
     la derecha -- mismo patron que usan las herramientas de contratos/
     propuestas modernas en vez del formato "PDF que se ve en pantalla". */
  .doc-shell {
    max-width: 920px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(260px, 300px) 1fr;
    background: #fff;
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(28,20,64,.04), 0 40px 90px -34px rgba(28,20,64,.32);
  }
  @media (max-width: 760px) {
    .doc-shell { grid-template-columns: 1fr; border-radius: 22px; }
  }
  .doc-side {
    position: relative;
    background: radial-gradient(140% 160% at 15% 0%, #382A7A 0%, var(--doc-brand) 50%, #100B2A 100%);
    color: #fff;
    padding: 40px 30px;
    display: flex;
    flex-direction: column;
    gap: 26px;
    overflow: hidden;
  }
  .doc-side::before {
    content: '';
    position: absolute;
    right: -80px; top: -100px;
    width: 260px; height: 260px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(115,87,246,.5) 0%, rgba(115,87,246,0) 70%);
  }
  .doc-side::after {
    content: '';
    position: absolute;
    left: -50px; bottom: -20px;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.05) 0%, rgba(255,255,255,0) 70%);
  }
  .doc-side > * { position: relative; }
  .doc-side-brand { display: flex; align-items: center; gap: 12px; }
  .doc-side-meta { padding-top: 20px; border-top: 1px solid rgba(255,255,255,.14); }
  .doc-side-meta .type { font-size: 10px; text-transform: uppercase; letter-spacing: .14em; opacity: .75; }
  .doc-side-meta .id { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 13px; opacity: .92; margin-top: 5px; }
  .doc-side-meta .date { font-size: 11px; opacity: .65; margin-top: 3px; }
  .doc-side-total .label { font-size: 10px; text-transform: uppercase; letter-spacing: .14em; opacity: .75; }
  .doc-side-total .amount { font-size: 34px; font-weight: 300; letter-spacing: -.01em; margin-top: 4px; line-height: 1.05; background: linear-gradient(90deg, #fff, #E4DDFF); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .doc-side-status { margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(255,255,255,.14); }
  .doc-side-footer { font-size: 11px; opacity: .55; line-height: 1.6; }
  @media (max-width: 760px) {
    .doc-side { padding: 32px 24px; }
    .doc-side-status { margin-top: 0; }
  }
  .doc-main { padding: 40px 40px 36px; }
  @media (max-width: 560px) { .doc-main, .doc-side { padding-left: 22px; padding-right: 22px; } }

  .doc-hero {
    position: relative;
    padding: 44px 40px 34px;
    background: radial-gradient(120% 160% at 0% 0%, #382A7A 0%, var(--doc-brand) 46%, #140E30 100%);
    color: #fff;
    overflow: hidden;
  }
  .doc-hero::before {
    content: '';
    position: absolute;
    right: -70px; top: -90px;
    width: 260px; height: 260px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(115,87,246,.55) 0%, rgba(115,87,246,0) 70%);
  }
  .doc-hero::after {
    content: '';
    position: absolute;
    left: -40px; bottom: -80px;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.06) 0%, rgba(255,255,255,0) 70%);
  }
  .doc-hero-row { position: relative; display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .doc-brand-mark { display: flex; align-items: center; gap: 12px; }
  .doc-brand-mark .glyph {
    width: 44px; height: 44px; border-radius: 13px;
    background: rgba(255,255,255,.08);
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 18px; letter-spacing: .02em;
    border: 1px solid rgba(255,255,255,.16);
    color: #fff;
  }
  .doc-brand-mark .name { font-size: 15px; font-weight: 600; letter-spacing: .04em; }
  .doc-brand-mark .tag { font-size: 10px; opacity: .75; letter-spacing: .14em; margin-top: 1px; }
  .doc-meta { text-align: right; }
  .doc-meta .type { font-size: 10px; text-transform: uppercase; letter-spacing: .14em; opacity: .8; }
  .doc-meta .id { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 13px; opacity: .92; margin-top: 4px; }
  .doc-meta .date { font-size: 11px; opacity: .7; margin-top: 3px; }
  .doc-hero-total { position: relative; margin-top: 30px; }
  .doc-hero-total .label { font-size: 10px; text-transform: uppercase; letter-spacing: .14em; opacity: .75; }
  .doc-hero-total .amount { font-size: 36px; font-weight: 300; letter-spacing: -.01em; margin-top: 2px; background: linear-gradient(90deg, #fff, #E4DDFF); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .doc-body { padding: 36px 40px 40px; }
  .doc-section { margin-bottom: 30px; }
  .doc-eyebrow { font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--doc-mute); font-weight: 600; margin-bottom: 10px; }
  .doc-parties { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 560px) { .doc-parties { grid-template-columns: 1fr; } .doc-body, .doc-hero { padding-left: 22px; padding-right: 22px; } }
  .doc-party-card { background: var(--doc-paper); border: 1px solid var(--doc-line); border-radius: 14px; padding: 16px 18px; }
  .doc-party-card .name { font-size: 15px; font-weight: 600; color: var(--doc-ink); }
  .doc-party-card .line { font-size: 12.5px; color: var(--doc-ink-soft); margin-top: 2px; }
  .doc-items { border: 1px solid var(--doc-line); border-radius: 16px; overflow: hidden; }
  .doc-item-row { display: flex; justify-content: space-between; gap: 16px; padding: 16px 18px; border-top: 1px solid var(--doc-line); transition: background .12s ease; }
  .doc-item-row:hover { background: var(--doc-brand-soft); }
  .doc-item-row:first-child { border-top: none; }
  .doc-item-row .name { font-weight: 600; font-size: 14px; color: var(--doc-ink); }
  .doc-item-row .desc { font-size: 12.5px; color: var(--doc-ink-soft); margin-top: 3px; white-space: pre-line; }
  .doc-item-row .price { font-weight: 600; font-size: 14px; white-space: nowrap; }
  .doc-total-line { display: flex; justify-content: space-between; align-items: baseline; padding: 20px 4px 4px; border-top: 2px solid var(--doc-ink); margin-top: 6px; }
  .doc-total-line .label { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--doc-ink-soft); }
  .doc-total-line .amount { font-size: 27px; font-weight: 300; color: var(--doc-accent-dark); }
  .doc-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .doc-list li { display: flex; align-items: flex-start; gap: 10px; font-size: 13.5px; color: var(--doc-ink-soft); }
  .doc-list svg { flex-shrink: 0; width: 16px; height: 16px; color: var(--doc-accent); margin-top: 2px; }
  .doc-note { background: #FFF8E8; border: 1px solid #F5E3B3; border-radius: 12px; padding: 14px 16px; font-size: 13px; color: #6B5216; white-space: pre-line; }
  .doc-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .doc-table th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--doc-mute); padding: 8px 4px; border-bottom: 1px solid var(--doc-line); font-weight: 600; }
  .doc-table td { padding: 10px 4px; border-bottom: 1px solid var(--doc-line); color: var(--doc-ink-soft); }
  .doc-table tr:last-child td { border-bottom: none; }

  /* La cotizacion y el contrato se abren casi siempre desde el telefono:
     llegan por WhatsApp. Una tabla de 4 columnas (Cuota / Fecha / Monto /
     Estado) no entra en 375px -- las celdas se aplastan o la pagina saca
     scroll horizontal, y el cliente ve su plan de pago cortado.

     En movil cada fila pasa a ser una ficha: etiqueta a la izquierda,
     valor a la derecha. Las etiquetas salen de data-label, asi que no
     hace falta repetir el encabezado. */
  @media (max-width: 560px) {
    .doc-table thead { display: none; }
    .doc-table,
    .doc-table tbody,
    .doc-table tr,
    .doc-table td { display: block; width: 100%; }
    .doc-table tr {
      border: 1px solid var(--doc-line);
      border-radius: 10px;
      padding: 4px 12px;
      margin-bottom: 10px;
    }
    .doc-table tr:last-child { margin-bottom: 0; }
    .doc-table td {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-align: right !important;
      padding: 9px 0;
    }
    .doc-table td:last-child { border-bottom: none; }
    .doc-table td[data-label]::before {
      content: attr(data-label);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--doc-mute);
      font-weight: 600;
      text-align: left;
      flex: 0 0 auto;
    }
  }
  .doc-pill { display: inline-flex; align-items: center; gap: 6px; padding: 7px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .doc-pill.green { background: #EAF8F0; color: #17864F; }
  .doc-pill.amber { background: #FDF1DC; color: #97620C; }
  .doc-pill.rose { background: #FCE8E8; color: #B4232A; }
  .doc-pill svg { width: 15px; height: 15px; }
  .doc-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-top: 28px; border-top: 1px solid var(--doc-line); }
  @media (max-width: 480px) { .doc-actions { grid-template-columns: 1fr; } }
  .doc-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 20px; border-radius: 12px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; transition: transform .12s ease, opacity .12s ease, box-shadow .12s ease; text-decoration: none; }
  .doc-btn:active { transform: scale(.98); }
  .doc-btn.primary { background: var(--doc-accent); color: #fff; box-shadow: 0 8px 20px -8px rgba(115,87,246,.55); }
  .doc-btn.primary:hover { background: var(--doc-accent-dark); box-shadow: 0 10px 24px -8px rgba(100,71,238,.6); }
  .doc-btn.outline { background: #fff; color: var(--doc-ink); border: 1px solid var(--doc-line); }
  .doc-btn.outline:hover { background: var(--doc-paper); }
  .doc-btn.full { grid-column: 1 / -1; }
  .doc-btn svg { width: 17px; height: 17px; }
  .doc-hint { grid-column: 1 / -1; text-align: center; font-size: 11.5px; color: var(--doc-mute); margin-top: -4px; }
  .doc-footer { text-align: center; padding: 20px; font-size: 11px; color: var(--doc-mute); border-top: 1px solid var(--doc-line); }
  .doc-status-banner { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 28px 20px; }

  /* ============================================================
     ERGONOMIA MOVIL DE LAS PAGINAS QUE VE EL CLIENTE
     ------------------------------------------------------------
     Cotizacion, contrato y cuestionario llegan por WhatsApp: casi
     siempre se abren en un telefono, y muchas veces la persona firma o
     responde ahi mismo. Estas paginas no heredan base.html, asi que las
     correcciones de ergonomia movil del CRM no les llegaban.

     El caso peor era el cuestionario: los radio y checkbox nativos miden
     ~18px. Contestar un cuestionario de bodas tocando circulos de 18px
     con el dedo es una forma segura de que el cliente lo abandone.
     ============================================================ */
  @media (max-width: 760px) {
    /* Safari en iPhone hace zoom al enfocar un input de menos de 16px. */
    input,
    select,
    textarea {
      font-size: 16px;
    }
    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="date"],
    select {
      min-height: 44px;
    }
    textarea { min-height: 96px; }

    input[type="checkbox"],
    input[type="radio"] {
      width: 24px;
      height: 24px;
      flex: 0 0 auto;
    }
    .q-radio-option,
    .q-check-option {
      min-height: 44px;
      align-items: center;
    }

    .doc-btn {
      min-height: 48px;
      width: 100%;
    }

    /* Un correo o una direccion larga no pueden empujar la tarjeta fuera
       de la pantalla. */
    .doc-body,
    .doc-side,
    .doc-parties,
    .doc-meta,
    .doc-table td {
      overflow-wrap: anywhere;
    }
  }

</style>
