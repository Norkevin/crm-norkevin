<div class="modal-overlay" id="mail-detail-modal">
  <div class="modal-content" style="width:min(720px,100%);">
    <button type="button" class="modal-close" onclick="closeModal('mail-detail-modal')" aria-label="Cerrar">x</button>
    <h2 class="modal-title">Detalle del correo</h2>
    <div class="sn-field-grid" style="margin-bottom:16px;">
      <div class="sn-field-label">Para</div><div class="sn-field-value" id="mail-detail-to"></div>
      <div class="sn-field-label">Fecha</div><div class="sn-field-value" id="mail-detail-date"></div>
      <div class="sn-field-label">Asunto</div><div class="sn-field-value" id="mail-detail-subject"></div>
    </div>
    <div class="sn-card white">
      <iframe id="mail-detail-html" title="Contenido del correo" sandbox="allow-popups allow-popups-to-escape-sandbox" style="display:none;width:100%;height:520px;border:0;"></iframe>
      <div id="mail-detail-body" style="white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;"></div>
    </div>
    <div class="sn-actions" style="margin-top:16px;">
      <button class="sn-btn" type="button" onclick="closeModal('mail-detail-modal')">Cerrar</button>
    </div>
  </div>
</div>

<script>
function openMailDetails(button) {
  var body = button.dataset.body || '';
  var ref = button.dataset.bodyRef ? document.getElementById(button.dataset.bodyRef) : null;
  if (ref) {
    try {
      body = JSON.parse(ref.textContent || '""');
    } catch (e) {
      body = ref.textContent || body;
    }
  }
  document.getElementById('mail-detail-to').textContent = button.dataset.to || '-';
  document.getElementById('mail-detail-date').textContent = button.dataset.date || '-';
  document.getElementById('mail-detail-subject').textContent = button.dataset.subject || 'Email';
  document.getElementById('mail-detail-body').textContent = body || 'No se guardó el contenido de este correo antiguo.';
  var htmlRef = button.dataset.htmlRef ? document.getElementById(button.dataset.htmlRef) : null;
  var html = htmlRef ? JSON.parse(htmlRef.textContent || '""') : '';
  var frame = document.getElementById('mail-detail-html');
  frame.srcdoc = html;
  frame.style.display = html ? 'block' : 'none';
  document.getElementById('mail-detail-body').style.display = html ? 'none' : 'block';
  openModal('mail-detail-modal');
}
</script>
