<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cotizacion aceptada · {{ theme.display_name if theme else brand.display_name }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: {{ theme.bone if theme else '#faf8f3' }};
  --dark: {{ theme.bg_dark if theme else '#0a0a0a' }};
  --cream: {{ theme.cream if theme else '#f4ede4' }};
  --ink: {{ theme.ink if theme else '#1a1a1a' }};
  --ink-soft: {{ theme.ink_soft if theme else '#5a5a5a' }};
  --line: {{ theme.line if theme else '#d4cfc5' }};
  --accent: {{ theme.accent if theme else '#c9a961' }};
  --serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
  --sans: 'Inter', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: var(--sans);
  -webkit-font-smoothing: antialiased; display: grid; place-items: center; padding: 24px;
  padding-left: max(24px, env(safe-area-inset-left)); padding-right: max(24px, env(safe-area-inset-right));
}
.card { width: min(480px, 100%); text-align: center; padding: clamp(36px, 8vw, 56px) clamp(24px, 6vw, 44px); border: 1px solid var(--line); background: #fff; }
.mark { width: 52px; height: 52px; border-radius: 50%; background: var(--dark); color: var(--accent); display: grid; place-items: center; margin: 0 auto 24px; font-size: 22px; }
.eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 10px; }
h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(26px, 6vw, 34px); margin: 0 0 16px; letter-spacing: -0.3px; }
p { margin: 0; color: var(--ink-soft); line-height: 1.6; font-size: 14.5px; }
.actions { display: flex; flex-direction: column; gap: 10px; margin-top: 32px; }
a.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 20px; text-decoration: none; font-size: 11.5px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; border: 1px solid var(--ink); color: var(--ink); }
a.btn.primary { background: var(--ink); color: var(--cream); }
</style>
</head>
<body>
  <main class="card" role="dialog" aria-labelledby="accepted-title">
    <div class="mark">&#10003;</div>
    <div class="eyebrow">Confirmado</div>
    <h1 id="accepted-title">Cotización aceptada</h1>
    <p>
      Gracias por aceptar esta cotización. Ya generamos tu factura y tu
      calendario de pagos — podés verlos en tu portal cuando quieras.
    </p>
    <div class="actions">
      {% if portal_url %}
      <a class="btn primary" href="{{ portal_url }}">Ir a mi portal</a>
      {% endif %}
      <a class="btn" href="{{ public_base if public_base else ('/quotes/' + quote.id) }}">Ver cotización</a>
    </div>
  </main>
</body>
</html>
