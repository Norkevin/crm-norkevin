services:
  - type: web
    name: crm-norkevin
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python tools/start_web_service.py
    envVars:
      - key: CRM_DATA_DIR
        value: /var/data
      - key: FLOW_MOBILE_ENABLED
        value: "1"
      - key: FLOW_MOBILE_PUSH_ENABLED
        value: "0"
      - key: FLOW_WEB_PUSH_ENABLED
        value: "0"
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GALLERY_INTEGRATION_TOKEN
        sync: false
    disk:
      name: crm-norkevin-data
      mountPath: /var/data
      sizeGB: 1
